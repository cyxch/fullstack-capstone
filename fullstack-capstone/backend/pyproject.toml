[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fullstack-capstone-backend"
version = "0.1.0"
description = "Python full-stack learning capstone backend"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".ruff_cache", ".pytest_cache", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

